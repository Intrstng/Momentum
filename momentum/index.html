<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./public/favicon.ico" rel="shortcut icon">
  <!-- <link rel="stylesheet" href="./src/css/owfont-regular.css"> -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
  <link rel="stylesheet" href="./src/sass/styles.css">
  <!-- <link rel="stylesheet" href="./src/css/style.css"> -->
  <title>Momentum</title>
</head>
<body>
  <header class="header">
    <!-- <audio><source src="./assets/sounds/Aqua Caelestis.mp3" id="song" type="audio/mp3"></audio> -->
      <div class="audio-player">
        <div class="controls">
        <div class="play-container">
          <button class="play-prev player-icon"></button>
          <button class="play player-icon"></button>
          <button class="play-next player-icon"></button>
        </div>
        <div class="track-name">Music Song</div>
        <div class="volume-container">
            <div class="volume-slider">
                <div class="volume-percentage"></div>
              </div>
          <div class="volume-button">
            <div class="volume icono-volumeMedium"></div>
          </div>
        </div>
      </div>
      <div class="timeline">
        <div class="progress"></div>
      </div>
      <div class="track-time">
        <div class="current">0:00</div>
        <div class="length">0:00</div>
      </div>
      <ul class="play-list">
      </ul>
      </div>
    <div class="weather">
      <input type="text" class="city" value="Minsk">
      <i class="weather-icon"></i>
      <div class="weather-error"></div>
      <div class="description-container">
        <span class="temperature"></span>
        <span class="weather-description"></span>
      </div>
      <div class="wind"></div>
      <div class="humidity"></div>
    </div>
  </header>
  <main class="main">
    <div class="slider-icons">
      <button class="slide-prev slider-icon"></button>
      <button class="slide-next slider-icon"></button>
    </div>
    <time class="time"></time>
    <date class="date"></date>
    <div class="greeting-container">
      <span class="greeting"></span>
      <input type="text" class="name" placeholder="[Enter name]">
    </div>
  </main>
  <footer class="footer">
    <button class="change-quote"></button>
    <div class="quote-block">
      <div class="quote"></div>
      <div class="author"></div>
    </div>
      <div class="copyright">
        <div class="settings-menu settings-menu_active"></div>
        <div><i class="copyright__settings copyright__settings_hover copyright__settings_active fa-sharp fa-solid fa-gear fa-2x"></i></div>
        <div class="copyright__icons">
          <span>2022</span>
          <a class="copyright__link copyright__link_hover" href="https://github.com/Intrstng" target="_blank"><img class="copyright__icon git-img" src="./assets/svg/github.svg" alt="GitHub icon"></a>
            <a class="copyright__link copyright__link_hover" href="https://rs.school/js-stage0/" target="_blank"><img class="copyright__icon rs-img" src="./assets/svg/rsschool.svg" alt="RS icon"></a>
        </div>
      </div>
  </footer>
  <script src="./src/index.js" type="module"></script>
</body>
</html>
