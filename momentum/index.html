<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./public/favicon.ico" rel="shortcut icon">
  <!-- <link rel="stylesheet" href="./src/css/owfont-regular.css"> -->
  <link rel="stylesheet" href="./src/sass/styles.css">
  <!-- <link rel="stylesheet" href="./src/css/style.css"> -->
  <title>Momentum</title>
</head>
<body>
  <header class="header">
    <div class="player">
      <audio src="./assets/sounds/Aqua Caelestis.mp3"></audio>


      <div class="audio-player">
        <div class="controls">
        <div class="play-container">
          <button class="play-prev player-icon"></button>
          <button class="play player-icon"></button>
          <button class="play-next player-icon"></button>
        </div>
        <div class="name">Music Song</div>
        <div class="volume-container">
            <div class="volume-slider">
                <div class="volume-percentage"></div>
              </div>
          <div class="volume-button">
            <div class="volume icono-volumeMedium"></div>
          </div>
        </div>
      </div>
      <div class="timeline">
        <div class="progress"></div>
      </div>
      <div class="time">
        <div class="current"></div>
        <div class="length"></div>
      </div>
      <ul class="play-list">
        <li><span>Qnver;vner;lkvn</span><span>20:22</span></li>
        <li><span>Qnver;vner;lkvn</span><span>20:22</span></li>
        <li><span>Qnver;vner;lkvn</span><span>20:22</span></li>
        <li><span>Qnver;vner;lkvn</span><span>20:22</span></li>
      </ul>
      </div>
    </div>
    <div class="weather">
      <input type="text" class="city" value="Minsk">
      <i class="weather-icon"></i>
      <div class="weather-error"></div>
      <div class="description-container">
        <span class="temperature"></span>
        <span class="weather-description"></span>
      </div>
      <div class="wind"></div>
      <div class="humidity"></div>
    </div>
  </header>
  <main class="main">
    <div class="slider-icons">
      <button class="slide-prev slider-icon"></button>
      <button class="slide-next slider-icon"></button>
    </div>
    <time class="time"></time>
    <date class="date"></date>
    <div class="greeting-container">
      <span class="greeting"></span>
      <input type="text" class="name" placeholder="[Enter name]">
    </div>
  </main>
  <footer class="footer">
    <button class="change-quote"></button>
    <div>
      <div class="quote"></div>
      <div class="author"></div>
    </div>
  </footer>
  <script src="./src/index.js" type="module"></script>
</body>
</html>
