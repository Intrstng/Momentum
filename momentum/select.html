<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/sass/select.css">
    <title>Select</title>
</head>
<body>
  <p>Photo source for background image</p>
  <div class="select-tag select-tag_hover select-tag_active">
    <ul class="select-tag__list">
      <li class="select-tag__item select-tag__item_hover select-tag__item_active" data-source="github">GitHub</li>
      <li class="select-tag__item select-tag__item_hover select-tag__item_active" data-source="unsplash">Unsplash Api</li>
      <li class="select-tag__item select-tag__item_hover select-tag__item_active" data-source="flickr">Flickr Api</li>
    </ul>
</div>
    <script src="select.js"></script>
</body>
</html>
